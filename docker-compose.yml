services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mangat-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-MangaT_Str0ng!Pass}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - mangat-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mangat-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=MangaTDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-MangaT_Str0ng!Pass};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: ${JWT_KEY:-MangaT-SuperSecretKey-ForDevelopment-Only-32chars!}
      Jwt__Issuer: ${JWT_ISSUER:-MangaT.API}
      Jwt__Audience: ${JWT_AUDIENCE:-MangaT.Client}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-60}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  mangat-sqlserver-data:
